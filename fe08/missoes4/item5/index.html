<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com Grid Areas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <header>
            <h1>Cabeçalho</h1>
        </header>

        <nav>
            <h2>Menu</h2>
            <p>Início</p>
            <p>Sobre</p>
            <p>Contato</p>
        </nav>

        <main>
            <h2>Conteúdo Principal</h2>
            <p>Este é o conteúdo principal da página.</p>
        </main>

        <aside>
            <h2>Área Lateral</h2>
            <p>Informações adicionais.</p>
        </aside>

        <footer>
            <p>Rodapé - Todos os direitos reservados.</p>
        </footer>

    </div>

</body>

</html>
